<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload Bukti TF - Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Firebase SDKs Updated -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
    <style>
        @page { size: A4; margin: 0; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
            .no-print { display: none !important; }
        }
        #canvas-wrapper {
            width: 100%;
            max-width: 794px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Modal Isi Nama Sales -->
    <div id="name-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Masukkan Nama Anda</h2>
            <input type="text" id="inputName" placeholder="Nama Sales" class="w-full px-4 py-2 border rounded-lg mb-4">
            <button onclick="startCanvas()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg">Mulai Upload</button>
        </div>
    </div>

    <!-- Area Kerja -->
    <div class="flex-1 flex flex-col">
        <div class="no-print bg-white shadow p-3 flex justify-between items-center sticky top-0 z-40">
            <div>
                <h1 id="headerName" class="font-bold text-gray-800 text-lg"></h1>
                <p id="headerDate" class="text-xs text-gray-500"></p>
            </div>
            <div class="flex gap-2">
                <label id="addBtnLabel" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg cursor-pointer font-bold text-sm flex items-center">
                    + <input type="file" id="addImage" accept="image/*" capture="environment" class="hidden">
                </label>
                <button onclick="saveToFirebase()" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-bold text-sm">Simpan</button>
            </div>
        </div>

        <div id="print-area" class="flex-1 bg-gray-300 flex items-start justify-center p-2 overflow-auto">
            <div id="canvas-wrapper">
                <canvas id="a4-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlNjmLa_b5RozsQnSVkWcOOnbBs40zVCA",
            authDomain: "bukti-tf-app.firebaseapp.com",
            projectId: "bukti-tf-app",
            storageBucket: "bukti-tf-app.firebasestorage.app",
            messagingSenderId: "559933904102",
            appId: "1:559933904102:web:42ca8db094c71969095727"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let canvas;
        let salesName = "";
        let salesDate = "";

        function startCanvas() {
            salesName = document.getElementById('inputName').value.trim();
            if(!salesName) return alert("Nama harus diisi!");

            salesDate = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('headerName').innerText = salesName;
            document.getElementById('headerDate').innerText = salesDate;

            canvas = new fabric.Canvas('a4-canvas', {
                width: 794,
                height: 1123,
                backgroundColor: 'white'
            });

            const titleText = new fabric.IText(`Sales: ${salesName}\nTanggal: ${salesDate}`, {
                left: 40, top: 40, fontFamily: 'Arial', fontSize: 24, fill: 'black', editable: false, selectable: false
            });
            canvas.add(titleText);

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            if(!canvas) return;
            const wrapperWidth = document.getElementById('canvas-wrapper').clientWidth;
            const scale = wrapperWidth / 794;
            document.querySelector('.canvas-container').style.transform = `scale(${scale})`;
            document.querySelector('.canvas-container').style.transformOrigin = 'top left';
            document.getElementById('canvas-wrapper').style.height = `${1123 * scale}px`;
        }

        // PERBAIKAN: Upload gambar langsung ke Firebase Storage saat dipilih
        document.getElementById('addImage').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = ''; // Reset input

            // Ubah tombol jadi loading
            const btnLabel = document.getElementById('addBtnLabel');
            const originalText = btnLabel.innerHTML;
            btnLabel.innerHTML = `⏳ Upload...`;
            btnLabel.style.pointerEvents = 'none';

            try {
                // 1. Upload gambar asli ke Firebase Storage
                const storageRef = storage.ref(`bukti_tf/${salesName}_${Date.now()}.jpg`);
                const snapshot = await storageRef.put(file);
                const url = await snapshot.ref.getDownloadURL();

                // 2. Masukkan URL Firebase ke Canvas Fabric.js
                fabric.Image.fromURL(url, function(img) {
                    if (img.width > 500) img.scaleToWidth(500);
                    img.set({ left: 100, top: 150, cornerColor: 'blue', cornerSize: 15, transparentCorners: false });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                }, { crossOrigin: 'anonymous' });

            } catch (error) {
                alert("Gagal upload gambar: " + error.message);
                console.error(error);
            } finally {
                // Kembalikan tombol ke semula
                btnLabel.innerHTML = originalText;
                btnLabel.style.pointerEvents = 'auto';
            }
        });

        // PERBAIKAN: Simpan hanya data posisi ke Firestore (URL gambar sudah ada di Storage)
        async function saveToFirebase() {
            if(!canvas) return;
            const objects = canvas.getObjects();
            const hasImage = objects.some(obj => obj.type === 'image');
            if(!hasImage) return alert("Belum ada gambar ditambahkan!");

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Menyimpan...";
            saveBtn.disabled = true;

            try {
                const jsonCanvas = canvas.toJSON(); // Ini tidak akan berisi base64 yang bikin berat
                await db.collection('canvases').add({
                    salesName: salesName,
                    date: salesDate,
                    canvasJSON: JSON.stringify(jsonCanvas),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Berhasil Disimpan!");
                window.location.reload();
            } catch (e) {
                alert("Gagal menyimpan: " + e.message);
                console.error(e);
                saveBtn.innerText = "Simpan";
                saveBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
