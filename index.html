<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload Bukti TF - Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        /* Agar Canvas A4 Presisi saat Print */
        @page { size: A4; margin: 0; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
            .no-print { display: none !important; }
            .canvas-container { transform: scale(1) !important; }
        }
        
        /* Agar canvas responsive di HP tanpa merusak ukuran asli */
        #canvas-wrapper {
            width: 100%;
            max-width: 794px; /* Resolusi A4 di 96 DPI */
            margin: 0 auto;
        }
        .canvas-container { margin: 0 auto; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Modal Isi Nama Sales -->
    <div id="name-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Masukkan Nama Anda</h2>
            <input type="text" id="inputName" placeholder="Nama Sales" class="w-full px-4 py-2 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-500">
            <button onclick="startCanvas()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">Mulai Upload</button>
        </div>
    </div>

    <!-- Area Kerja Canvas -->
    <div class="flex-1 flex flex-col">
        <!-- Header & Kontrol -->
        <div class="no-print bg-white shadow p-3 flex justify-between items-center sticky top-0 z-40">
            <div>
                <h1 id="headerName" class="font-bold text-gray-800 text-lg"></h1>
                <p id="headerDate" class="text-xs text-gray-500"></p>
            </div>
            <div class="flex gap-2">
                <label class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg cursor-pointer font-bold text-sm flex items-center">
                    + <input type="file" id="addImage" accept="image/*" capture="environment" class="hidden">
                </label>
                <button onclick="saveToFirebase()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-bold text-sm">Simpan</button>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="print-area" class="flex-1 bg-gray-300 flex items-start justify-center p-2 overflow-auto">
            <div id="canvas-wrapper">
                <canvas id="a4-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // === PASTE KONFIGURASI FIREBASE ANDA DI BAWAH INI ===
        const firebaseConfig = {
  apiKey: "AIzaSyDlNjmLa_b5RozsQnSVkWcOOnbBs40zVCA",
  authDomain: "bukti-tf-app.firebaseapp.com",
  projectId: "bukti-tf-app",
  storageBucket: "bukti-tf-app.firebasestorage.app",
  messagingSenderId: "559933904102",
  appId: "1:559933904102:web:42ca8db094c71969095727"
};
        // ====================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Setup A4 Canvas (Ukuran Asli A4 794x1123 px @96dpi)
        let canvas;
        let salesName = "";
        let salesDate = "";

        function startCanvas() {
            salesName = document.getElementById('inputName').value.trim();
            if(!salesName) return alert("Nama harus diisi!");

            salesDate = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('headerName').innerText = salesName;
            document.getElementById('headerDate').innerText = salesDate;

            canvas = new fabric.Canvas('a4-canvas', {
                width: 794,
                height: 1123,
                backgroundColor: 'white'
            });

            // Tambahkan Judul Nama & Tanggal di dalam canvas agar ikut terprint
            const titleText = new fabric.IText(`Sales: ${salesName}\nTanggal: ${salesDate}`, {
                left: 40,
                top: 40,
                fontFamily: 'Arial',
                fontSize: 24,
                fill: 'black',
                editable: false,
                selectable: false
            });
            canvas.add(titleText);

            // Responsive Canvas di Mobile
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const wrapperWidth = document.getElementById('canvas-wrapper').clientWidth;
            const scale = wrapperWidth / 794;
            const zoom = canvas.getZoom();
            
            // Visual scaling pakai CSS transform
            document.querySelector('.canvas-container').style.transform = `scale(${scale})`;
            document.querySelector('.canvas-container').style.transformOrigin = 'top left';
            document.getElementById('canvas-wrapper').style.height = `${1123 * scale}px`;
        }

        // Tambah Gambar ke Canvas
        document.getElementById('addImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                fabric.Image.fromURL(event.target.result, function(img) {
                    // Resize gambar agar tidak terlalu besar di canvas (max lebar 500px)
                    if (img.width > 500) {
                        img.scaleToWidth(500);
                    }
                    
                    // Posisi random/tengah
                    img.set({
                        left: 150,
                        top: 150,
                        cornerColor: 'blue',
                        cornerSize: 15,
                        transparentCorners: false
                    });

                    canvas.add(img);
                    canvas.setActiveObject(img);
                });
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset input
        });

        // Simpan ke Firebase
        async function saveToFirebase() {
            if(!canvas) return;
            
            const objects = canvas.getObjects();
            let imageProcessed = 0;
            let totalImages = objects.filter(obj => obj.type === 'image').length;

            if(totalImages === 0) return alert("Belum ada gambar ditambahkan!");

            // Upload semua gambar ke Storage, lalu ganti src di JSON dengan URL Firebase
            const jsonCanvas = canvas.toJSON();
            
            for (let i = 0; i < jsonCanvas.objects.length; i++) {
                let obj = jsonCanvas.objects[i];
                if (obj.type === 'image' && obj.src.startsWith('data:')) {
                    try {
                        const blob = dataURItoBlob(obj.src);
                        const ref = storage.ref(`bukti_tf/${salesName}_${Date.now()}_${i}.jpg`);
                        const snapshot = await ref.put(blob);
                        const url = await snapshot.ref.getDownloadURL();
                        obj.src = url; // Ganti Base64 jadi URL Firebase
                    } catch (e) {
                        console.error("Gagal upload gambar", e);
                    }
                }
            }

            // Simpan JSON Canvas ke Firestore
            try {
                await db.collection('canvases').add({
                    salesName: salesName,
                    date: salesDate,
                    canvasJSON: JSON.stringify(jsonCanvas),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Berhasil Disimpan!");
                window.location.reload();
            } catch (e) {
                alert("Gagal menyimpan ke database: " + e.message);
            }
        }

        // Helper: Convert Base64 to Blob
        function dataURItoBlob(dataURI) {
            var byteString = atob(dataURI.split(',')[1]);
            var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            var ab = new ArrayBuffer(byteString.length);
            var ia = new Uint8Array(ab);
            for (var i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], {type: mimeString});
        }
    </script>
</body>
</html>
